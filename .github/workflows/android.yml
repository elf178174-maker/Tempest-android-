name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build an unsigned release APK"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned so a green build stays green. Bump deliberately, not by drift.
  RUST_VERSION: "1.88.0"
  NDK_VERSION: "27.2.12479018"
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be checked without an Android device or the SDK.
  # Fast, so a logic error is reported in about a minute.
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --verbose

      - name: Build the desktop CLI
        run: cargo build --release -p tempest

      - uses: actions/upload-artifact@v4
        with:
          name: tempest-linux-cli
          path: target/release/tempest
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The APK.
  # ---------------------------------------------------------------------------
  android:
    name: Build the Android APK
    runs-on: ubuntu-latest
    # Deliberately not gated on rust-tests. The two jobs test different things
    # and both must pass; running them in parallel halves the time to find out
    # that something is broken.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust with the Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version ^3 --locked

      # -- native pieces ----------------------------------------------------
      #
      # Two separate native artefacts end up in the APK, and they are not
      # interchangeable:
      #
      #   libtempest_jni.so  the Rust core, loaded with System.loadLibrary
      #   libproot*.so       PRoot, *executed* as a program
      #
      # Both must live in nativeLibraryDir, because that is the only place an
      # app targeting API 29+ may execve() from.
      - name: Build the Rust core for arm64-v8a
        run: |
          cargo ndk \
            --target arm64-v8a \
            --platform 29 \
            --output-dir android/app/src/main/jniLibs \
            build --release -p tempest-jni

      - name: Build PRoot for arm64-v8a
        run: ./scripts/build-proot.sh android/app/src/main/jniLibs/arm64-v8a

      - name: Show what will be packaged
        run: |
          echo "jniLibs contents:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          echo
          for f in android/app/src/main/jniLibs/arm64-v8a/*.so; do
            echo "== $f"
            file "$f" || true
            sha256sum "$f"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Kotlin unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Assemble the debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Assemble the release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the artifacts predictably
        id: names
        run: |
          mkdir -p out
          VERSION="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/tempest-android-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/tempest-android-${VERSION}-${SHORT_SHA}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
               out/tempest-android-release-unsigned.apk
          fi
          {
            echo "### APK built"
            echo
            echo "| file | size |"
            echo "|---|---|"
            for f in out/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Download it from the **tempest-android-debug** artifact below,"
            echo "then see \`docs/TROUBLESHOOTING.md\` for install instructions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK actually contains the native libraries
        run: |
          # A build that silently drops the native libraries produces an APK
          # that installs and then fails on first launch. Catch it here.
          unzip -l out/tempest-android-debug.apk | tee /tmp/apk-listing.txt
          for lib in libtempest_jni.so libproot.so libproot-loader.so; do
            if ! grep -q "lib/arm64-v8a/${lib}" /tmp/apk-listing.txt; then
              echo "::error::${lib} is missing from the APK"
              exit 1
            fi
            echo "ok: ${lib}"
          done

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tempest-android-debug
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14

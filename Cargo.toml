[workspace]
resolver = "2"
members = [
    "crates/tempest-core",
    "crates/tempest-cli",
    "crates/tempest-jni",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Verified floor. Below this, transitive dependencies (cookie_store, the ICU
# crates pulled in by `url`) fail to build; the CI workflow pins the same value.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elf178174-maker/Tempest-android-"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
url = "2"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
xz2 = "0.1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

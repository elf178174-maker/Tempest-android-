# 2 GB is enough for this module and keeps the build inside a standard
# GitHub-hosted runner's memory budget.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# arm64-v8a only. The compatibility stack (Hangover's ARM64 Wine and the FEX
# emulator) exists solely for 64-bit ARM, so shipping other ABIs would produce
# an app that installs and then cannot run anything.
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
